name: MRsleep
version: '${version}'
main: at.marcelr.mrsleep.MRSleep
api-version: '${mcVersion}'
softdepend: [MRadmin]
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Better sleep quota with exemptions, /nosleep, admin menu and Discord logs.

commands:
  nosleep:
    description: Blocks sleeping for one or more nights (run it again to cancel).
    usage: /nosleep [nights|off|info]
    permission: mrsleep.nosleep
  mrsleep:
    description: Management of MRsleep.
    usage: /mrsleep <gui|status|debug|clear|release|bypass|resetcooldown|ban|unban|bans|reload|version>

permissions:
  mrsleep.exempt:
    description: Player is not counted for the sleep quota (e.g. cam or bot accounts).
    default: false
  mrsleep.nosleep:
    description: Allows /nosleep.
    default: true
  mrsleep.nosleep.info:
    description: /nosleep info - show your own sleep and /nosleep status.
    default: true
  mrsleep.nosleep.nocooldown:
    description: Use /nosleep without cooldown (must be granted explicitly, OPs do not get it automatically either).
    default: false
  mrsleep.admin:
    description: All admin commands of MRsleep.
    default: op
    children:
      mrsleep.admin.gui: true
      mrsleep.admin.reload: true
      mrsleep.admin.status: true
      mrsleep.admin.clear: true
      mrsleep.admin.bypass: true
      mrsleep.admin.ban: true
      mrsleep.admin.teleport: true
      mrsleep.admin.update: true
      mrsleep.admin.discord: true
  mrsleep.admin.discord:
    description: /mrsleep discord [test] - status of the Discord webhook and test message.
    default: op
  mrsleep.admin.gui:
    description: /mrsleep gui - open the admin menu (actions in it also need their own permission).
    default: op
  mrsleep.admin.reload:
    description: /mrsleep reload
    default: op
  mrsleep.admin.status:
    description: /mrsleep status and /mrsleep debug
    default: op
  mrsleep.admin.clear:
    description: /mrsleep clear and /mrsleep release - remove /nosleep blocks.
    default: op
  mrsleep.admin.bypass:
    description: /mrsleep bypass and /mrsleep resetcooldown - manage players' cooldowns.
    default: op
  mrsleep.admin.ban:
    description: /mrsleep ban, unban and bans - exclude players from /nosleep.
    default: op
  mrsleep.admin.teleport:
    description: Teleport to players in the admin menu.
    default: op
  mrsleep.admin.update:
    description: Notice when joining the server if an MRsleep update is available.
    default: op
