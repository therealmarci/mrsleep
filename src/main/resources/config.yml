# ==============================================================================
#   MRsleep - Configuration
# ==============================================================================
#   After changes:   /mrsleep reload   (no restart needed)
#   Admin menu:      /mrsleep gui
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mrsleep/
#
#   Durations: d = days, h = hours, m = minutes, s = seconds
#              e.g. "15m", "1h30m", "2d". A plain number counts as minutes.
#
#   Texts & messages: lang/de.yml or lang/en.yml (see "language" below).
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 10

# Language of the texts (chat, menus, display). The texts are in plugins/MRsleep/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client:
#          German (also Austria/Switzerland) -> de.yml, English -> en.yml, a language without a file -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it - with "auto"
# French players then get it automatically.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en

# Language of texts that are not meant for a single player: Discord logs.
server-language: en


# ------------------------------------------------------------------------------
#   1) SLEEP QUOTA
# ------------------------------------------------------------------------------
sleep:
  # Percentage of the counted players in a world who have to sleep (0-100).
  # Players with the permission "mrsleep.exempt" are not counted (e.g. cam or bot accounts).
  percentage: 50

  # Minimum number of sleeping players (never more than the number of counted players).
  minimum-sleepers: 1

  # Worlds MRsleep leaves alone (the Nether and the End are always excluded).
  disabled-worlds: []

  # Do not count players in spectator mode (like vanilla).
  ignore-spectators: true

  # Do not count players another plugin marks as "sleeping ignored" (e.g. AFK).
  respect-sleeping-ignored: true

  # Do not count players in MRadmin's admin mode (only when MRadmin is installed).
  ignore-admin-mode: true

  # Do not count players in an MRpvp duel (also in the arena editor). The arena world itself is never
  # managed. Needs MRpvp AND MRadmin (the plugins talk to each other through MRadmin's module interface).
  ignore-pvp: true

  # Clear the weather when the night is skipped (like vanilla).
  clear-weather: true

  # Where the progress ("1/2 players sleeping") or a block is shown:
  #   bossbar   = bar at the top of the screen with a progress bar (recommended - not hidden by
  #               the chat window that opens in bed)
  #   actionbar = above the hotbar (hidden by the chat window while in bed)
  #   title     = subtitle in the middle of the screen
  #   none      = nothing
  display: bossbar
  # Boss bar colours: pink, blue, red, green, yellow, purple, white
  bossbar-color: yellow
  bossbar-blocked-color: red
  # Hide Minecraft's own "x/y players sleeping" in the action bar - it counts everyone and does not know the rules
  # of MRsleep. It is replaced right away by MRsleep's progress (display: actionbar) or cleared.
  hide-vanilla-message: true

  # Chat message "<player> went to bed (1/2)":
  #   world  = to all players in the same world
  #   server = to all players on the server
  #   none   = no message
  sleep-message: world

  # Chat message to the world when the night was skipped.
  announce-skip: true


# ------------------------------------------------------------------------------
#   2) /NOSLEEP
# ------------------------------------------------------------------------------
nosleep:
  # Cooldown between two blocks per player.
  # It only starts when the blocked night begins (from then on you can sleep, also during thunderstorms).
  # Blocking during the day and cancelling before nightfall causes no cooldown.
  # Cancelling during the night is always possible, but the cooldown keeps running.
  # Exempt: permission "mrsleep.nosleep.nocooldown" or an admin bypass.
  cooldown: 15m

  # How many nights a player may block at once with "/nosleep <number>".
  max-nights: 3

  # true  = In a blocked night you cannot get into bed at all
  #         (so no respawn point is set either).
  # false = You can get into bed, but the night is not skipped.
  prevent-bed-enter: false

  # Cancel a player's block when they leave the server.
  release-on-quit: true

  # Tell all players in the world when someone uses or cancels /nosleep.
  broadcast: true


# ------------------------------------------------------------------------------
#   3) DISCORD LOGS
# ------------------------------------------------------------------------------
# Create a webhook: Discord channel -> Edit Channel -> Integrations -> Webhooks
#                   -> New Webhook -> Copy Webhook URL.
# The texts of the events are in the language file (lang/<language>.yml, section discord).
# An event with "enabled: false" or an empty text is not sent.
# Not working? -> /mrsleep discord shows the status, /mrsleep discord test sends a test message.
discord:
  enabled: false
  # Full URL in quotes, e.g. "https://discord.com/api/webhooks/123456/abcdef"
  webhook-url: ""
  # Name and avatar of the webhook (empty = settings from Discord).
  username: "MRsleep"
  avatar-url: ""
  # true = coloured embeds, false = plain text messages.
  use-embeds: true
  # Footer of the embeds, e.g. the server name (empty = none).
  footer: "Minecraft-Server"
  events:
    nosleep-activated:
      enabled: true
      color: "#E67E22"
    nosleep-deactivated:
      enabled: true
      color: "#2ECC71"
    nosleep-quit:
      enabled: true
      color: "#95A5A6"
    nosleep-expired:
      enabled: true
      color: "#95A5A6"
    night-start-blocked:
      enabled: true
      color: "#34495E"
    bed-blocked:
      enabled: true
      color: "#E74C3C"
    night-skipped:
      enabled: true
      color: "#F1C40F"
    admin-clear:
      enabled: true
      color: "#9B59B6"
    admin-release:
      enabled: true
      color: "#9B59B6"
    admin-bypass:
      enabled: true
      color: "#9B59B6"
    admin-bypass-remove:
      enabled: true
      color: "#9B59B6"
    admin-cooldown-reset:
      enabled: true
      color: "#9B59B6"
    admin-ban:
      enabled: true
      color: "#C0392B"
    admin-unban:
      enabled: true
      color: "#27AE60"
    admin-reload:
      enabled: true
      color: "#3498DB"


# ------------------------------------------------------------------------------
#   4) UPDATE CHECK
# ------------------------------------------------------------------------------
update-checker:
  # Look for new versions on startup and regularly afterwards.
  # If a newer version is available, a notice appears in the console.
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  # How often to check again (in hours).
  interval-hours: 6
  # Notify players with "mrsleep.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   5) ADMIN MENU (/mrsleep gui)
# ------------------------------------------------------------------------------
gui:
  # How often the open menu is refreshed (in ticks, 20 = 1 second).
  refresh-ticks: 20
  # Quick choices for the cooldown bypass in the player menu (exactly 3 entries).
  bypass-durations: ["30m", "2h", "1d"]
  # Quick choices for /nosleep bans ("permanent" = forever, exactly 3 entries).
  ban-durations: ["1h", "1d", "permanent"]
  # Click sounds in the menu.
  sounds: true


# ------------------------------------------------------------------------------
#   6) TEAM LIMITS
# ------------------------------------------------------------------------------
# Longest cooldown bypass and /nosleep ban the team may give - in commands, the menu and MRadmin's web interface.
#   support: everyone with mrsleep.admin.bypass / mrsleep.admin.ban (in mrsleep.groups.support)
#   staff:   with mrsleep.admin.bypass.staff / mrsleep.admin.ban.staff (in mrsleep.groups.staff)
#   No limit and permanent bans: mrsleep.admin.bypass.unlimited / mrsleep.admin.ban.unlimited (in mrsleep.groups.admin)
limits:
  support:
    bypass: "30m"
    ban: "1d"
  staff:
    bypass: "1d"
    ban: "1d"
