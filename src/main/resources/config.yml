# ==============================================================================
#   MRsleep - Konfiguration
# ==============================================================================
#   Nach Änderungen:  /mrsleep reload   (kein Neustart nötig)
#   Admin-Menü:       /mrsleep gui
#   Hilfe & Doku:     README.md im Projekt bzw. auf GitHub / Modrinth
#
#   Zeitangaben: d = Tage, h = Stunden, m = Minuten, s = Sekunden
#                z.B. "15m", "1h30m", "2d". Eine reine Zahl zählt als Minuten.
#
#   Diese Datei ist UTF-8-kodiert. Falls Umlaute (ä, ö, ü) falsch angezeigt werden,
#   im Editor die Kodierung auf "UTF-8" stellen.
# ==============================================================================

# Nicht ändern - wird für automatische Config-Updates verwendet.
config-version: 4


# ------------------------------------------------------------------------------
#   1) SCHLAFQUOTE
# ------------------------------------------------------------------------------
sleep:
  # Prozent der zählenden Spieler einer Welt, die schlafen müssen (0-100).
  # Spieler mit der Permission "mrsleep.exempt" zählen nicht mit (z.B. Cam-/Bot-Accounts).
  percentage: 50

  # Mindestanzahl schlafender Spieler (nie mehr als die Anzahl zählender Spieler).
  minimum-sleepers: 1

  # Welten, in denen MRsleep nicht eingreift (Nether/End sind immer ausgenommen).
  disabled-worlds: []

  # Spieler im Zuschauermodus nicht mitzählen (wie Vanilla).
  ignore-spectators: true

  # Spieler nicht mitzählen, die ein anderes Plugin als "sleeping ignored" markiert (z.B. AFK).
  respect-sleeping-ignored: true

  # Wetter beim Überspringen der Nacht aufklaren lassen (wie Vanilla).
  clear-weather: true

  # Wo der Fortschritt ("1/2 Spieler schlafen") bzw. eine Blockade angezeigt wird:
  #   bossbar   = Leiste oben am Bildschirm mit Fortschrittsbalken (empfohlen - wird vom
  #               Chat-Fenster, das sich im Bett öffnet, nicht verdeckt)
  #   actionbar = über der Hotbar (wird im Bett vom Chat-Fenster verdeckt)
  #   title     = Untertitel in der Bildschirmmitte
  #   none      = keine Anzeige
  display: bossbar
  # Farben der Bossbar: pink, blue, red, green, yellow, purple, white
  bossbar-color: yellow
  bossbar-blocked-color: red

  # Chat-Meldung "<Spieler> hat sich schlafen gelegt (1/2)":
  #   world  = an alle Spieler in derselben Welt
  #   server = an alle Spieler auf dem Server
  #   none   = keine Meldung
  sleep-message: world

  # Chat-Nachricht an die Welt, wenn die Nacht übersprungen wurde.
  announce-skip: true


# ------------------------------------------------------------------------------
#   2) /NOSLEEP
# ------------------------------------------------------------------------------
nosleep:
  # Cooldown zwischen zwei Blockaden pro Spieler.
  # Er startet erst, wenn die blockierte Nacht anbricht (ab da kann man schlafen, auch bei Gewitter).
  # Wird tagsüber blockiert und vor Nachtbeginn wieder aufgehoben, entsteht kein Cooldown.
  # Aufheben in der Nacht ist jederzeit möglich, der Cooldown läuft dann aber weiter.
  # Ausgenommen: Permission "mrsleep.nosleep.nocooldown" oder ein Admin-Bypass.
  cooldown: 15m

  # Wie viele Nächte ein Spieler mit "/nosleep <anzahl>" höchstens auf einmal blockieren darf.
  max-nights: 3

  # true  = In einer blockierten Nacht kann man sich gar nicht erst hinlegen
  #         (dann wird auch kein Respawnpunkt gesetzt).
  # false = Man kann sich hinlegen, die Nacht wird aber nicht übersprungen.
  prevent-bed-enter: false

  # Blockade eines Spielers aufheben, wenn er den Server verlässt.
  release-on-quit: true

  # Alle Spieler der Welt informieren, wenn jemand /nosleep nutzt oder aufhebt.
  broadcast: true


# ------------------------------------------------------------------------------
#   3) DISCORD-LOGS
# ------------------------------------------------------------------------------
# Webhook anlegen: Discord-Kanal -> Kanal bearbeiten -> Integrationen -> Webhooks
#                  -> Neuer Webhook -> Webhook-URL kopieren.
# Platzhalter: {player} {world} {nights} {players} {admin} {time} {reason}
#              {sleeping} {needed} {counted}
# Ein Event mit "enabled: false" oder leerer Nachricht wird nicht gesendet.
discord:
  enabled: false
  webhook-url: ""
  # Name und Avatar des Webhooks (leer = Einstellungen aus Discord).
  username: "MRsleep"
  avatar-url: ""
  # true = farbige Embeds, false = einfache Textnachrichten.
  use-embeds: true
  # Fußzeile der Embeds, z.B. der Servername (leer = keine).
  footer: "Minecraft-Server"
  events:
    nosleep-activated:
      enabled: true
      color: "#E67E22"
      message: "🛏️ **{player}** blockiert das Schlafen in **{world}** für **{nights}**."
    nosleep-deactivated:
      enabled: true
      color: "#2ECC71"
      message: "✅ **{player}** hat die Schlafblockade in **{world}** aufgehoben."
    nosleep-quit:
      enabled: true
      color: "#95A5A6"
      message: "🚪 Die Schlafblockade von **{player}** in **{world}** wurde aufgehoben (Server verlassen)."
    nosleep-expired:
      enabled: true
      color: "#95A5A6"
      message: "⌛ Die Schlafblockade von **{player}** in **{world}** ist abgelaufen."
    night-start-blocked:
      enabled: true
      color: "#34495E"
      message: "🌙 Die Nacht in **{world}** beginnt - Schlafen blockiert von **{players}** (noch {nights})."
    bed-blocked:
      enabled: true
      color: "#E74C3C"
      message: "⛔ **{player}** wollte in **{world}** schlafen, blockiert von **{players}** (noch {nights})."
    night-skipped:
      enabled: true
      color: "#F1C40F"
      message: "🌅 Die Nacht in **{world}** wurde übersprungen ({sleeping}/{needed} Spieler schliefen)."
    admin-clear:
      enabled: true
      color: "#9B59B6"
      message: "🛠️ **{admin}** hat die Schlafblockade in **{world}** entfernt (blockiert von: {players})."
    admin-release:
      enabled: true
      color: "#9B59B6"
      message: "🛠️ **{admin}** hat die Schlafblockade von **{player}** in **{world}** aufgehoben."
    admin-bypass:
      enabled: true
      color: "#9B59B6"
      message: "🛠️ **{admin}** hat **{player}** für **{time}** vom /nosleep-Cooldown befreit."
    admin-bypass-remove:
      enabled: true
      color: "#9B59B6"
      message: "🛠️ **{admin}** hat den Cooldown-Bypass von **{player}** entfernt."
    admin-cooldown-reset:
      enabled: true
      color: "#9B59B6"
      message: "🛠️ **{admin}** hat den /nosleep-Cooldown von **{player}** zurückgesetzt."
    admin-ban:
      enabled: true
      color: "#C0392B"
      message: "🔒 **{admin}** hat **{player}** von /nosleep ausgeschlossen ({time}, Grund: {reason})."
    admin-unban:
      enabled: true
      color: "#27AE60"
      message: "🔓 **{admin}** hat die /nosleep-Sperre von **{player}** aufgehoben."
    admin-reload:
      enabled: true
      color: "#3498DB"
      message: "🔄 **{admin}** hat die MRsleep-Konfiguration neu geladen."


# ------------------------------------------------------------------------------
#   4) UPDATE-CHECK
# ------------------------------------------------------------------------------
update-checker:
  # Beim Start und danach regelmäßig nach neuen Versionen suchen.
  # Ist eine neuere Version verfügbar, erscheint ein Hinweis in der Konsole.
  enabled: true
  # Quelle: "github" (GitHub Releases, Standard) oder "modrinth"
  source: github
  # Auch Beta-/Alpha-Versionen melden. Läuft selbst eine Vorabversion (0.x), werden sie immer gemeldet.
  include-prereleases: false
  # Wie oft erneut geprüft wird (in Stunden).
  interval-hours: 6
  # Spieler mit "mrsleep.admin.update" beim Betreten des Servers informieren.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   5) ADMIN-MENÜ (/mrsleep gui)
# ------------------------------------------------------------------------------
gui:
  # Wie oft das geöffnete Menü aktualisiert wird (in Ticks, 20 = 1 Sekunde).
  refresh-ticks: 20
  # Schnellauswahl für den Cooldown-Bypass im Spieler-Menü (genau 3 Einträge).
  bypass-durations: ["30m", "2h", "1d"]
  # Schnellauswahl für /nosleep-Sperren ("permanent" = dauerhaft, genau 3 Einträge).
  ban-durations: ["1h", "1d", "permanent"]
  # Grund, der bei Sperren über das Menü eingetragen wird.
  ban-reason: "über das Admin-Menü"
  # Klick-Sounds im Menü.
  sounds: true


# ------------------------------------------------------------------------------
#   6) NACHRICHTEN
# ------------------------------------------------------------------------------
# Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
# Leere Nachricht ("") = wird nicht gesendet.
# <nights> wird über nights-singular / nights-plural zu "1 Nacht" oder "3 Nächte".
messages:
  prefix: "<dark_gray>[<aqua>MRsleep</aqua>]</dark_gray> "
  nights-singular: "1 Nacht"
  nights-plural: "<count> Nächte"

  # --- Allgemein ---------------------------------------------------------------
  no-permission: "<prefix><red>Dazu hast du keine Berechtigung."
  players-only: "<prefix><red>Dieser Befehl kann nur von Spielern genutzt werden."
  world-not-managed: "<prefix><red>In dieser Welt kann nicht geschlafen werden."
  player-not-found: "<prefix><red>Spieler <white><player></white> wurde nicht gefunden."
  invalid-duration: "<prefix><red>Ungültige Dauer <white><input></white>. Beispiele: 30m, 2h, 1d12h"

  # --- Schlafen ----------------------------------------------------------------
  # Anzeige laut sleep.display (Bossbar / Actionbar / Titel)
  display-sleeping: "<gray><yellow><sleeping></yellow>/<yellow><needed></yellow> Spieler schlafen"
  display-blocked: "<red>Schlafen blockiert von <white><players></white> <gray>(noch <nights>)"
  # Empfänger laut sleep.sleep-message. Platzhalter: <player> <world> <sleeping> <needed>
  player-sleeping: "<prefix><gray><white><player></white> hat sich schlafen gelegt <dark_gray>(<yellow><sleeping></yellow>/<yellow><needed></yellow>)"
  night-skipped: "<prefix><yellow>Guten Morgen! Die Nacht wurde übersprungen."
  night-start-blocked: "<prefix><gray>Die Nacht bricht an - Schlafen ist blockiert von <gold><players></gold> <gray>(noch <nights>)."
  bed-prevented: "<prefix><gold><players></gold> <red>hat das Schlafen blockiert, du kannst nicht schlafen. Noch <white><nights></white>."
  bed-blocked-warning: "<prefix><gold><players></gold> <yellow>hat das Schlafen blockiert - die Nacht wird nicht übersprungen. Noch <white><nights></white>."
  bed-excluded: "<prefix><gray>Hinweis: Du zählst nicht zur Schlafquote <dark_gray>(<reason>)<gray>. Dein Schlafen überspringt die Nacht nicht."
  join-blocked-info: "<prefix><gray>Info: Schlafen ist gerade blockiert von <gold><players></gold> <gray>(noch <nights>)."
  reason-exempt: "Permission mrsleep.exempt"
  reason-spectator: "Zuschauermodus"
  reason-sleeping-ignored: "von einem anderen Plugin ignoriert, z.B. AFK"

  # --- /nosleep ----------------------------------------------------------------
  nosleep-activated: "<prefix><green>Du blockierst das Schlafen für <white><nights></white>. Nutze <white>/nosleep</white> erneut, um es aufzuheben."
  nosleep-updated: "<prefix><green>Deine Schlafblockade gilt jetzt für <white><nights></white>."
  nosleep-deactivated: "<prefix><green>Du hast deine Schlafblockade aufgehoben."
  nosleep-deactivated-free: "<prefix><green>Du hast deine Schlafblockade aufgehoben. <gray>Die Nacht hatte noch nicht begonnen - es entsteht kein Cooldown."
  nosleep-deactivated-cooldown: "<prefix><green>Du hast deine Schlafblockade aufgehoben. <gray>Dein Cooldown läuft weiter (noch <white><time></white>)."
  nosleep-pending-info: "<prefix><gray>Der Cooldown (<white><time></white>) startet erst, wenn die Nacht anbricht. Hebst du die Blockade vorher auf, entsteht keiner."
  nosleep-cooldown-started: "<prefix><gray>Die Nacht bricht an - deine Blockade ist aktiv, dein <white>/nosleep</white>-Cooldown (<white><time></white>) läuft ab jetzt."
  nosleep-not-active: "<prefix><gray>Du hast gerade keine Schlafblockade aktiv."
  nosleep-invalid-nights: "<prefix><red>Bitte gib eine Anzahl zwischen <white>1</white> und <white><max></white> Nächten an: <white>/nosleep [anzahl]"
  nosleep-cooldown: "<prefix><red>Du kannst <white>/nosleep</white> erst wieder in <white><time></white> nutzen."
  nosleep-banned: "<prefix><red>Du bist von <white>/nosleep</white> ausgeschlossen <dark_gray>(<duration>, Grund: <reason>)<red>."
  nosleep-broadcast-activated: "<prefix><gold><player></gold> <gray>blockiert das Schlafen für <white><nights></white>."
  nosleep-broadcast-deactivated: "<prefix><gold><player></gold> <gray>hat die Schlafblockade aufgehoben."
  nosleep-broadcast-quit: "<prefix><gray>Die Schlafblockade von <gold><player></gold> wurde aufgehoben (Server verlassen)."
  nosleep-broadcast-released: "<prefix><gray>Die Schlafblockade von <gold><player></gold> wurde von <white><admin></white> aufgehoben."
  nosleep-expired: "<prefix><gray>Die Schlafblockade von <gold><player></gold> ist abgelaufen - ab jetzt kann wieder geschlafen werden."

