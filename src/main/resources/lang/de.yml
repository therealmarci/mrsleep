  <prefix><gray>Dein Schlaf-Status:
  <dark_gray> » <gray>Welt: <white><world></white> <dark_gray>(<phase>)
  <dark_gray> » <gray>Schlafen: <white><sleeping></white>/<white><needed></white> <dark_gray>| <gray>du zählst: <counts>
  <dark_gray> » <gray>Blockiert von: <blockers>
  <dark_gray> » <gray>Deine Blockade: <own>
  <dark_gray> » <gray>Dein Cooldown: <cooldown>
  <dark_gray> » <gray>/nosleep: <ban>
  <dark_gray> » <gray>Befehle: <white>/nosleep [1-<max>]</white><gray>, <white>/nosleep off</white><gray>, <white>/nosleep info
nosleep-info-blockers: "<gold><players>"
nosleep-broadcast-activated: "<prefix><gold><player></gold> <gray>blockiert das Schlafen für <white><nights></white>."
nosleep-broadcast-deactivated: "<prefix><gold><player></gold> <gray>hat die Schlafblockade aufgehoben."
nosleep-broadcast-quit: "<prefix><gray>Die Schlafblockade von <gold><player></gold> wurde aufgehoben (Server verlassen)."
nosleep-broadcast-released: "<prefix><gray>Die Schlafblockade von <gold><player></gold> wurde von <white><admin></white> aufgehoben."
nosleep-expired: "<prefix><gray>Die Schlafblockade von <gold><player></gold> ist abgelaufen - ab jetzt kann wieder geschlafen werden."

# --- Admin-Befehle -----------------------------------------------------------
admin-usage: |-
  <prefix><gray>Befehle:
  <aqua>/mrsleep gui</aqua> <dark_gray>- <gray>Admin-Menü mit allen Spielern
  <aqua>/mrsleep status [welt]</aqua> <dark_gray>- <gray>Schlafstatus anzeigen
  <aqua>/mrsleep debug</aqua> <dark_gray>- <gray>Details pro Welt und Spieler
  <aqua>/mrsleep clear [welt]</aqua> <dark_gray>- <gray>Alle Blockaden einer Welt entfernen
  <aqua>/mrsleep release <spieler></aqua> <dark_gray>- <gray>Blockade eines Spielers aufheben
  <aqua>/mrsleep bypass <spieler> <dauer></aqua> <dark_gray>- <gray>Cooldown für eine Dauer aufheben
  <aqua>/mrsleep bypass remove|list</aqua> <dark_gray>- <gray>Bypässe verwalten
  <aqua>/mrsleep resetcooldown <spieler></aqua> <dark_gray>- <gray>Cooldown zurücksetzen
  <aqua>/mrsleep ban <spieler> [dauer] [grund]</aqua> <dark_gray>- <gray>Von /nosleep ausschließen
  <aqua>/mrsleep unban <spieler></aqua> <dark_gray>- <gray>Sperre aufheben
  <aqua>/mrsleep bans</aqua> <dark_gray>- <gray>Alle Sperren anzeigen
  <aqua>/mrsleep discord [test]</aqua> <dark_gray>- <gray>Discord-Status / Testnachricht
  <aqua>/mrsleep reload</aqua> <dark_gray>- <gray>Konfiguration neu laden
