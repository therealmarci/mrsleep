# ==============================================================================
#   MRsleep - Sprachdatei: Deutsch (de)
# ==============================================================================
#   Aktivieren: in der config.yml  language: de
#   Eigene Sprache: diese Datei kopieren (z.B. als fr.yml), übersetzen und language: fr setzen.
#   Fehlende Texte werden bei Updates automatisch ergänzt - deine Änderungen bleiben erhalten.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Leerer Text ("") = Nachricht wird nicht gesendet.
#   <nights> wird über nights-singular / nights-plural zu "1 Nacht" oder "3 Nächte".
# ==============================================================================

# Nicht ändern - damit erkennt das Plugin bei Updates, welche Texte erneuert werden müssen.
lang-version: 2

# Texte der Discord-Logs (Markdown wie in Discord). Platzhalter: {player} {world} {nights} {players}
# {admin} {time} {reason} {sleeping} {needed} {counted}. An/aus und Farbe stehen in der config.yml.
discord:
  test-message: "🔧 Testnachricht von MRsleep - der Webhook funktioniert!"
  nosleep-activated: "🛏️ **{player}** blockiert das Schlafen in **{world}** für **{nights}**."
  nosleep-deactivated: "✅ **{player}** hat die Schlafblockade in **{world}** aufgehoben."
  nosleep-quit: "🚪 Die Schlafblockade von **{player}** in **{world}** wurde aufgehoben (Server verlassen)."
  nosleep-expired: "⌛ Die Schlafblockade von **{player}** in **{world}** ist abgelaufen."
  night-start-blocked: "🌙 Die Nacht in **{world}** beginnt - Schlafen blockiert von **{players}** (noch {nights})."
  bed-blocked: "⛔ **{player}** wollte in **{world}** schlafen, blockiert von **{players}** (noch {nights})."
  night-skipped: "🌅 Die Nacht in **{world}** wurde übersprungen ({sleeping}/{needed} Spieler schliefen)."
  admin-clear: "🛠️ **{admin}** hat die Schlafblockade in **{world}** entfernt (blockiert von: {players})."
  admin-release: "🛠️ **{admin}** hat die Schlafblockade von **{player}** in **{world}** aufgehoben."
  admin-bypass: "🛠️ **{admin}** hat **{player}** für **{time}** vom /nosleep-Cooldown befreit."
  admin-bypass-remove: "🛠️ **{admin}** hat den Cooldown-Bypass von **{player}** entfernt."
  admin-cooldown-reset: "🛠️ **{admin}** hat den /nosleep-Cooldown von **{player}** zurückgesetzt."
  admin-ban: "🔒 **{admin}** hat **{player}** von /nosleep ausgeschlossen ({time}, Grund: {reason})."
  admin-unban: "🔓 **{admin}** hat die /nosleep-Sperre von **{player}** aufgehoben."
  admin-reload: "🔄 **{admin}** hat die MRsleep-Konfiguration neu geladen."

# Grund, der bei Sperren über das Admin-Menü eingetragen wird.
gui-ban-reason: "über das Admin-Menü"

prefix: "<dark_gray>[<aqua>MRsleep</aqua>]</dark_gray> "
nights-singular: "1 Nacht"
nights-plural: "<count> Nächte"

