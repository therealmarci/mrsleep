# ==============================================================================
#   MRsleep - language file: English (en)
# ==============================================================================
#   Activate: in config.yml  language: en
#   Own language: copy this file (e.g. as fr.yml), translate it and set language: fr.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
#   <nights> is formatted with nights-singular / nights-plural, e.g. "1 night" or "3 nights".
# ==============================================================================

# Do not change - tells the plugin which texts need to be renewed on updates.
lang-version: 2

# Discord log texts (Discord markdown). Placeholders: {player} {world} {nights} {players}
# {admin} {time} {reason} {sleeping} {needed} {counted}. On/off and colour are set in config.yml.
discord:
  test-message: "🔧 Test message from MRsleep - the webhook works!"
  nosleep-activated: "🛏️ **{player}** blocks sleeping in **{world}** for **{nights}**."
  nosleep-deactivated: "✅ **{player}** lifted the sleep block in **{world}**."
  nosleep-quit: "🚪 The sleep block of **{player}** in **{world}** was lifted (left the server)."
  nosleep-expired: "⌛ The sleep block of **{player}** in **{world}** has expired."
  night-start-blocked: "🌙 Night begins in **{world}** - sleeping blocked by **{players}** ({nights} left)."
  bed-blocked: "⛔ **{player}** tried to sleep in **{world}**, blocked by **{players}** ({nights} left)."
  night-skipped: "🌅 The night in **{world}** was skipped ({sleeping}/{needed} players slept)."
  admin-clear: "🛠️ **{admin}** removed the sleep block in **{world}** (blocked by: {players})."
  admin-release: "🛠️ **{admin}** lifted the sleep block of **{player}** in **{world}**."
  admin-bypass: "🛠️ **{admin}** exempted **{player}** from the /nosleep cooldown for **{time}**."
  admin-bypass-remove: "🛠️ **{admin}** removed the cooldown bypass of **{player}**."
  admin-cooldown-reset: "🛠️ **{admin}** reset the /nosleep cooldown of **{player}**."
  admin-ban: "🔒 **{admin}** banned **{player}** from /nosleep ({time}, reason: {reason})."
  admin-unban: "🔓 **{admin}** lifted the /nosleep ban of **{player}**."
  admin-reload: "🔄 **{admin}** reloaded the MRsleep configuration."

# Reason entered when banning via the admin menu.
gui-ban-reason: "via the admin menu"

prefix: "<dark_gray>[<aqua>MRsleep</aqua>]</dark_gray> "
nights-singular: "1 night"
nights-plural: "<count> nights"

# --- General -----------------------------------------------------------------
no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>This command can only be used by players."
world-not-managed: "<prefix><red>You can't sleep in this world."
player-not-found: "<prefix><red>Player <white><player></white> was not found."
invalid-duration: "<prefix><red>Invalid duration <white><input></white>. Examples: 30m, 2h, 1d12h"
value-yes: "yes"
value-no: "no"

# --- Sleeping ----------------------------------------------------------------
# Shown as set in sleep.display (boss bar / action bar / title)
display-sleeping: "<gray><yellow><sleeping></yellow>/<yellow><needed></yellow> players sleeping"
display-blocked: "<red>Sleeping blocked by <white><players></white> <gray>(<nights> left)"
# Recipients as set in sleep.sleep-message. Placeholders: <player> <world> <sleeping> <needed>
player-sleeping: "<prefix><gray><white><player></white> went to bed <dark_gray>(<yellow><sleeping></yellow>/<yellow><needed></yellow>)"
night-skipped: "<prefix><yellow>Good morning! The night was skipped."
night-start-blocked: "<prefix><gray>Night falls - sleeping is blocked by <gold><players></gold> <gray>(<nights> left)."
bed-prevented: "<prefix><gold><players></gold> <red>blocked sleeping, you can't sleep. <white><nights></white> left."
bed-blocked-warning: "<prefix><gold><players></gold> <yellow>blocked sleeping - the night will not be skipped. <white><nights></white> left."
bed-excluded: "<prefix><gray>Note: you don't count towards the sleep quota <dark_gray>(<reason>)<gray>. Your sleeping does not skip the night."
join-blocked-info: "<prefix><gray>Info: sleeping is currently blocked by <gold><players></gold> <gray>(<nights> left)."
reason-exempt: "permission mrsleep.exempt"
reason-spectator: "spectator mode"
reason-sleeping-ignored: "ignored by another plugin, e.g. AFK"
reason-admin-mode: "in admin mode (MRadmin)"
reason-pvp: "in a duel (MRpvp)"

# --- /nosleep ----------------------------------------------------------------
nosleep-activated: "<prefix><green>You block sleeping for <white><nights></white>. Use <white>/nosleep</white> again to lift it."
nosleep-updated: "<prefix><green>Your sleep block now lasts <white><nights></white>."
nosleep-deactivated: "<prefix><green>You lifted your sleep block."
nosleep-deactivated-free: "<prefix><green>You lifted your sleep block. <gray>The night had not started yet - no cooldown."
nosleep-deactivated-cooldown: "<prefix><green>You lifted your sleep block. <gray>Your cooldown keeps running (<white><time></white> left)."
nosleep-pending-info: "<prefix><gray>The cooldown (<white><time></white>) only starts when night falls. If you lift the block before that, there is none."
nosleep-cooldown-started: "<prefix><gray>Night falls - your block is active, your <white>/nosleep</white> cooldown (<white><time></white>) starts now."
nosleep-not-active: "<prefix><gray>You have no active sleep block."
nosleep-invalid-nights: "<prefix><red>Please enter a number between <white>1</white> and <white><max></white> nights: <white>/nosleep [nights]</white><red>, or <white>/nosleep info</white><red> for your status."
nosleep-cooldown: "<prefix><red>You can use <white>/nosleep</white> again in <white><time></white>."
nosleep-banned: "<prefix><red>You are banned from <white>/nosleep</white> <dark_gray>(<duration>, reason: <reason>)<red>."
# /nosleep info - values like <counts>, <own>, <cooldown>, <ban> come from the gui-value-* texts below.
nosleep-info: |-
  <prefix><gray>Your sleep status:
  <dark_gray> » <gray>World: <white><world></white> <dark_gray>(<phase>)
  <dark_gray> » <gray>Sleeping: <white><sleeping></white>/<white><needed></white> <dark_gray>| <gray>you count: <counts>
  <dark_gray> » <gray>Blocked by: <blockers>
  <dark_gray> » <gray>Your block: <own>
  <dark_gray> » <gray>Your cooldown: <cooldown>
  <dark_gray> » <gray>/nosleep: <ban>
  <dark_gray> » <gray>Commands: <white>/nosleep [1-<max>]</white><gray>, <white>/nosleep off</white><gray>, <white>/nosleep info
nosleep-info-blockers: "<gold><players>"
nosleep-broadcast-activated: "<prefix><gold><player></gold> <gray>blocks sleeping for <white><nights></white>."
nosleep-broadcast-deactivated: "<prefix><gold><player></gold> <gray>lifted the sleep block."
nosleep-broadcast-quit: "<prefix><gray>The sleep block of <gold><player></gold> was lifted (left the server)."
nosleep-broadcast-released: "<prefix><gray>The sleep block of <gold><player></gold> was lifted by <white><admin></white>."
nosleep-expired: "<prefix><gray>The sleep block of <gold><player></gold> has expired - you can sleep again."

# --- Admin commands ----------------------------------------------------------
admin-usage: |-
  <prefix><gray>Commands:
  <aqua>/mrsleep gui</aqua> <dark_gray>- <gray>Admin menu with all players
  <aqua>/mrsleep status [world]</aqua> <dark_gray>- <gray>Show sleep status
  <aqua>/mrsleep debug</aqua> <dark_gray>- <gray>Details per world and player
  <aqua>/mrsleep clear [world]</aqua> <dark_gray>- <gray>Remove all blocks in a world
  <aqua>/mrsleep release <player></aqua> <dark_gray>- <gray>Lift a player's block
  <aqua>/mrsleep bypass <player> <duration></aqua> <dark_gray>- <gray>Lift the cooldown for a while
  <aqua>/mrsleep bypass remove|list</aqua> <dark_gray>- <gray>Manage bypasses
  <aqua>/mrsleep resetcooldown <player></aqua> <dark_gray>- <gray>Reset the cooldown
  <aqua>/mrsleep ban <player> [duration] [reason]</aqua> <dark_gray>- <gray>Ban from /nosleep
  <aqua>/mrsleep unban <player></aqua> <dark_gray>- <gray>Lift a ban
  <aqua>/mrsleep bans</aqua> <dark_gray>- <gray>Show all bans
  <aqua>/mrsleep discord [test]</aqua> <dark_gray>- <gray>Discord status / test message
  <aqua>/mrsleep reload</aqua> <dark_gray>- <gray>Reload the configuration
  <aqua>/mrsleep version</aqua> <dark_gray>- <gray>Version & update status
reloaded: "<prefix><green>Configuration reloaded."
status: "<prefix><gray>World <white><world></white>: <yellow><sleeping></yellow>/<yellow><needed></yellow> sleeping, <yellow><counted></yellow> counted, <yellow><exempt></yellow> exempt. Blocked by: <white><players></white>"
status-none: "-"
world-not-found: "<prefix><red>World <white><world></white> not found or not managed."
cleared: "<prefix><green>Sleep block in <white><world></white> removed."
clear-none: "<prefix><gray>There is no sleep block in <white><world></white>."
cleared-broadcast: "<prefix><gray>The sleep block was lifted by <white><admin></white> - you can sleep again."
released: "<prefix><green>Block of <white><player></white> lifted."
release-none: "<prefix><gray><white><player></white> is not blocking any night."
bypass-set: "<prefix><green><white><player></white> can use /nosleep without cooldown for <white><time></white>."
bypass-removed: "<prefix><green>Bypass of <white><player></white> removed."
